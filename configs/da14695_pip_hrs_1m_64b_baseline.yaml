# DA14695 peripheral-side PIP HRS baseline.
# This records the validated 64B setup without workstation-specific paths,
# debugger serials, IQ captures, or generated firmware products.

platform: da14695
role: peripheral
service: heart_rate
embedding: pip

covert:
  length_bytes: 64
  control: "phantom pip-covert-hex <hex>"
  whitening_crc_contract: da14695_sw_fake_header_only_no_hw

link:
  phy: 1M
  interval_ms: 20
  latency: 0
  supervision_timeout_ms: 4000
  mtu: 251
  max_tx_octets: 251
  fixed_random_address: "C0:DE:52:84:00:41"

central:
  board: nrf52840dk/nrf52840
  request_phy: 1M
  auto_phy_update: false
  rx_debug: true

receiver:
  device: b210
  center_frequency_hz: 2420000000
  sample_rate_sps: 40000000
  bandwidth_hz: 40000000
  antenna: RX2
  gain_db: 50
