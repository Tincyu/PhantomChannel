# Independent benign calibration matched to the formal connection timing.
# Keep the 30 ms interval but do not initiate a PHY update; the historical
# formal pcaps remain on the initial 1M link and contain no PHY request.
CONFIG_PHANTOMCHANNEL_CENTRAL_TX=y
CONFIG_PHANTOMCHANNEL_COVERT_LEN=0
CONFIG_PHANTOMCHANNEL_WRITE_INTERVAL_MS=20
CONFIG_PHANTOMCHANNEL_CONN_INTERVAL_UNITS=24
CONFIG_PHANTOMCHANNEL_EMBED_ENABLE=n
CONFIG_PHANTOMCHANNEL_DYNAMIC_TIMING=n
CONFIG_PHANTOMCHANNEL_FORCE_2M=n
CONFIG_PHANTOMCHANNEL_FORCE_1M=n
CONFIG_BT_AUTO_PHY_UPDATE=n
CONFIG_PHANTOMCHANNEL_FIXED_TARGET=y
CONFIG_PHANTOMCHANNEL_TARGET_ADDRESS="C0:DE:52:83:00:33"
