# Normal HRS connection: no Phantom marker or post-CRC tail.
# The peripheral-side 231-byte source value is deliberately disabled here.
CONFIG_PHANTOMCHANNEL_PERIPHERAL_TX=n
CONFIG_PHANTOMCHANNEL_EMBED_ENABLE=n
CONFIG_PHANTOMCHANNEL_NOTIFY_INTERVAL_MS=20
CONFIG_PHANTOMCHANNEL_STATIC_ADDRESS="C0:DE:52:84:00:03"
