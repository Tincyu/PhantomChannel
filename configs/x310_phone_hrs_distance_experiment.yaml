# Phone-facing X310 rate-test configuration.
# Distance is intentionally optional for the current rate-only closure.

experiment:
  name: x310_phone_hrs_rate
  duration_s: 10
  distance_experiment_enabled: false

capture:
  requested_sample_rate_sps: 80000000
  expected_sample_rate_sps: 100000000
  bandwidth_hz: 80000000
  center_frequency_hz: 2440000000
  gain_db: 50
  antenna: RX2
  channel: 0
  usrp_args: type=x300,addr=192.168.40.2,master_clock_rate=200e6

parser:
  source_project_root: /path/to/BLE_encrypt_check
  python: /path/to/PhantomChannel/.venv-cuda/bin/python
  entrypoint: /path/to/BLE_encrypt_check/experiment/bt_40m_pfb_realtime.py
  ble_threshold: 0.02
  subband_sample_rate_sps: 4000000
  chunk_samples: 16000000
  overlap_samples: 200000
  cpp_parser_threads: 4
  cuda_device: 0

phone:
  device_name: PhantomHRS
  address: C0:DE:52:84:00:03
  firmware_variant: phantomchannel_hrs_peripheral
  hrs_service_uuid: 180D
  hrs_measurement_uuid: 2A37
  notification_interval_ms: 20
  covert_len_bytes: 231
  rtt_available: false
  bluez_central_used: false

firmware:
  build_dir: /path/to/PhantomChannel/artifacts/firmware/phantomchannel_hrs_peripheral
